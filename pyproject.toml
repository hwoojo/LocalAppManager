[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "localapp-manager"
version = "0.1.0"
description = "Safely register and manage local Linux applications"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "LocalAppManager contributors" }]
dependencies = []

[project.scripts]
localapp = "localapp_manager.cli:main"
localapp-gui = "localapp_manager.gui:main"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
